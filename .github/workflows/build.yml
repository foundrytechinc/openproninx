name: Core build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bmake clang lld llvm qemu-system-x86 ovmf
      - name: Build and boot-smoke images without mutating sources
        run: bmake ci
      - name: Publish evaluation images
        uses: actions/upload-artifact@v4
        with:
          name: fnu-proninx-core-images
          path: obj/*.img
          if-no-files-found: error
      - name: Publish the staged root tree
        uses: actions/upload-artifact@v4
        with:
          name: fnu-proninx-root-tree
          path: obj/root
          if-no-files-found: error

  ufs2-system-image:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore the staged root tree
        uses: actions/download-artifact@v4
        with:
          name: fnu-proninx-root-tree
          path: obj/root
      - name: Make the UFS2 root in FreeBSD and check it with FreeBSD's fsck
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            makefs -t ffs -s 32m -o version=2,bsize=8192,fsize=1024,label=FNU-ROOT obj/fnu-root.ufs obj/root
            fsck_ffs -n obj/fnu-root.ufs
      - name: Publish the UFS2 root
        uses: actions/upload-artifact@v4
        with:
          name: fnu-proninx-ufs2-root
          path: obj/fnu-root.ufs
          if-no-files-found: error
