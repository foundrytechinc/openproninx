# /etc/fnupkg.conf — repositories for fnupkg (one per line)
#
# Format:
#   <path> | file:///<path> | http://host[:port]/prefix
#   [sha256=<64 hex digits of that repo's index>]
#
# Built into the image by default:
#   1) local packages under /usr/share/fnupkg/repo  (works offline)
#   2) remote Foundry repo over HTTP (optional pin; verified if set)
#
# sha256= is optional everywhere. For http:// it is recommended —
# without it a MITM can replace index+packages together.
# Digest lives in the repo as index.sha256 (or printed by `fnupkg update`).
#
# Order matters: first match by package name wins. Max 32 repos.
# `#` and blank lines are ignored.
#
# install/search use the local index immediately — no `update` required
# for packages already in this image. Run `fnupkg update` to refresh
# remote indexes.

