# What useradd(8) gives a new account unless told otherwise.

# where homes are made, and what a new one starts with (dot.x becomes .x)
home=/home
skel=/etc/skel
shell=/usr/bin/sh
# private: a group of its own, named as the account; or the name of a group
group=private
# the mode of a new home
mode=0700
# where new uids and gids are taken from
uid=1000-60000
gid=1000-60000
